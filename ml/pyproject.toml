[project]
name = "forecastops-ml"
version = "0.1.0"
description = "Forecasting library for retail demand"
requires-python = ">=3.12"
dependencies = [
  "forecastops-contracts",
  "numpy>=2.1",
  "pyarrow>=18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecastops_ml"]
