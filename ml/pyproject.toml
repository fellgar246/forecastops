[project]
name = "forecastops-ml"
version = "0.1.0"
description = "Forecasting library for retail demand"
requires-python = ">=3.12"
dependencies = [
  "forecastops-contracts",
  "lightgbm>=4.6",
  "numpy>=2.1",
  "pyarrow>=18",
  "pydantic>=2.6",
  "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecastops_ml"]

[tool.hatch.build.targets.wheel.force-include]
"forecastops_ml/training/fixtures/deepar_forecast.json" = "forecastops_ml/training/fixtures/deepar_forecast.json"
"forecastops_ml/evaluation/fixtures/benchmark-v1.json" = "forecastops_ml/evaluation/fixtures/benchmark-v1.json"
