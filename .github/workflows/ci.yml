name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Backend lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Backend typecheck
        run: uv run mypy

      - name: Backend tests
        run: uv run pytest apps/api/tests packages/contracts/tests packages/fixtures/tests tests

      - name: ML unit tests
        run: uv run pytest ml/tests --ignore=ml/tests/test_features.py

      - name: Leakage tests
        run: uv run pytest ml/tests/test_features.py

      - name: Frontend lint
        run: npm --prefix apps/web run lint

      - name: Frontend typecheck
        run: npm --prefix apps/web run typecheck

      - name: Frontend tests
        run: npm --prefix apps/web test

      - name: Infrastructure format and validate
        run: make aws-plan

      - name: Security scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-files: .env.example
          skip-dirs: .venv,node_modules,.terraform
